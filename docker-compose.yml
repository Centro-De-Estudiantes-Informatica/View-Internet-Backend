# Infraestructura local: Postgres (sustituye a Neon en desarrollo) y RustFS (S3 compatible).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: view
      POSTGRES_PASSWORD: view
      POSTGRES_DB: view_internet
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U view -d view_internet']
      interval: 2s
      retries: 20

  s3:
    # Versión fijada por digest: la imagen minio/minio dejó de estar disponible en Docker Hub.
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - s3-data:/data

volumes:
  db-data:
  s3-data:
