# Infraestructura local: Postgres (sustituye a Neon en desarrollo) y MinIO (S3 compatible).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: view
      POSTGRES_PASSWORD: view
      POSTGRES_DB: view_internet
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U view -d view_internet']
      interval: 2s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
