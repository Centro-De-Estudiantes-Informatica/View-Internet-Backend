# Aplica las migraciones pendientes a la base de producción antes de desplegar la API.
# Requiere el secreto DIRECT_URL (host directo de Neon, sin -pooler) en el entorno "production".
# El paso de despliegue de la API se agrega cuando se elija el hosting (tarea 8.1).
name: Migrate database

on:
  push:
    branches: [main]
    paths:
      - 'prisma/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SCARF_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then echo "::error::Falta el secreto DIRECT_URL" && exit 1; fi
          npx prisma migrate deploy
